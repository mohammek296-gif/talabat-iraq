<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>عين التمر | طلبات</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link
 rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Cairo,Arial,sans-serif;
 background:#f5f6f8;
 color:#222
}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer;border:0}
.header{
 position:sticky;
 top:0;
 z-index:1000;
 background:#fff;
 box-shadow:0 2px 12px #0001;
 padding:12px 18px
}
.header-inner{
 max-width:1200px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px
}
.logo{
 font-size:24px;
 font-weight:800;
 color:#f4511e;
 cursor:pointer
}
.nav{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}
.btn{
 padding:10px 15px;
 border-radius:10px;
 font-weight:700
}
.btn-primary{background:#f4511e;color:white}
.btn-dark{background:#222;color:white}
.btn-light{background:#eee;color:#222}
.btn-success{background:#16a34a;color:white}
.btn-danger{background:#dc2626;color:white}
.btn-warning{background:#f59e0b;color:white}
.container{
 max-width:1200px;
 margin:auto;
 padding:20px
}
.hero{
 background:linear-gradient(135deg,#ff7043,#e64a19);
 color:white;
 border-radius:20px;
 padding:30px;
 margin-bottom:25px
}
.hero h1{margin:0 0 8px;font-size:32px}
.hero p{margin:0;opacity:.95}
.search{
 width:100%;
 padding:14px 16px;
 border:1px solid #ddd;
 border-radius:12px;
 background:white;
 font-size:16px
}
.section-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:25px 0 15px
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
 gap:16px
}
.card{
 background:white;
 border-radius:16px;
 box-shadow:0 2px 10px #0000000d;
 overflow:hidden;
 border:1px solid #eee
}
.card-body{padding:15px}
.food-img,.restaurant-img{
 width:100%;
 height:180px;
 object-fit:cover;
 background:#eee
}
.food-img{height:160px}
.price{
 color:#f4511e;
 font-size:20px;
 font-weight:800
}
.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
 font-weight:700
}
.badge-open{background:#dcfce7;color:#15803d}
.badge-closed{background:#fee2e2;color:#b91c1c}
.panel{
 background:white;
 border-radius:16px;
 padding:20px;
 box-shadow:0 2px 10px #0001;
 margin-bottom:20px
}
.form-group{margin-bottom:14px}
.form-group label{
 display:block;
 margin-bottom:6px;
 font-weight:700
}
.form-control{
 width:100%;
 padding:12px;
 border:1px solid #ddd;
 border-radius:10px;
 font-size:15px;
 background:#fff
}
textarea.form-control{min-height:100px;resize:vertical}
.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 z-index:3000;
 padding:15px
}
.modal.active{display:flex}
.modal-box{
 background:white;
 width:min(600px,100%);
 max-height:92vh;
 overflow:auto;
 border-radius:18px;
 padding:20px
}
.modal-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:15px
}
.close{
 background:#eee;
 width:35px;
 height:35px;
 border-radius:50%;
 font-size:20px
}
.tabs{
 display:flex;
 gap:8px;
 overflow:auto;
 margin-bottom:20px
}
.tab{
 padding:10px 16px;
 background:#eee;
 border-radius:10px;
 white-space:nowrap
}
.tab.active{background:#f4511e;color:#fff}
.hidden{display:none!important}
.empty{
 padding:40px 20px;
 text-align:center;
 color:#777
}
.cart{
 position:fixed;
 left:20px;
 bottom:20px;
 z-index:1500;
 width:60px;
 height:60px;
 border-radius:50%;
 background:#f4511e;
 color:white;
 font-size:24px;
 box-shadow:0 5px 20px #0003
}
.cart-count{
 position:absolute;
 top:-5px;
 right:-5px;
 background:#111;
 color:white;
 width:24px;
 height:24px;
 border-radius:50%;
 font-size:12px;
 display:flex;
 align-items:center;
 justify-content:center
}
.cart-item{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 border-bottom:1px solid #eee;
 padding:12px 0
}
.qty{
 display:flex;
 align-items:center;
 gap:8px
}
.qty button{
 width:30px;
 height:30px;
 border-radius:8px;
 background:#eee
}
.stat-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:15px
}
.stat{
 background:#fff;
 padding:20px;
 border-radius:15px;
 box-shadow:0 2px 10px #0001
}
.stat-number{
 font-size:30px;
 font-weight:800;
 color:#f4511e
}
.table-wrap{overflow:auto}
table{
 width:100%;
 border-collapse:collapse;
 min-width:700px
}
th,td{
 padding:12px;
 border-bottom:1px solid #eee;
 text-align:right
}
th{background:#fafafa}
.order-card{
 border:1px solid #ddd;
 border-radius:14px;
 padding:15px;
 margin-bottom:12px
}
.order-head{
 display:flex;
 justify-content:space-between;
 gap:10px;
 flex-wrap:wrap
}
.status{
 padding:5px 10px;
 border-radius:20px;
 font-size:12px;
 font-weight:700;
 background:#eee
}
.status-new{background:#dbeafe;color:#1d4ed8}
.status-accepted{background:#fef3c7;color:#92400e}
.status-preparing{background:#ffedd5;color:#c2410c}
.status-ready{background:#dcfce7;color:#15803d}
.status-completed{background:#dcfce7;color:#166534}
.status-rejected{background:#fee2e2;color:#991b1b}
.status-assigned{background:#e0e7ff;color:#3730a3}
.status-picked_up{background:#fef3c7;color:#92400e}
.status-delivered{background:#dcfce7;color:#166534}
#map{
 height:350px;
 border-radius:15px;
 overflow:hidden
}
.toast{
 position:fixed;
 top:80px;
 left:50%;
 transform:translateX(-50%);
 z-index:5000;
 background:#222;
 color:#fff;
 padding:12px 20px;
 border-radius:10px;
 display:none;
 box-shadow:0 4px 15px #0003
}
.toast.show{display:block}
footer{
 margin-top:50px;
 padding:30px;
 background:#222;
 color:#ddd;
 text-align:center
}
@media(max-width:700px){
 .hero h1{font-size:25px}
 .container{padding:12px}
 .header-inner{align-items:flex-start}
 .nav{justify-content:flex-end}
 .logo{font-size:20px}
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<header class="header">
 <div class="header-inner">
  <div class="logo" onclick="showHome()">عين التمر 🍔</div>
  <div class="nav">
   <button class="btn btn-light" onclick="showHome()">الرئيسية</button>
   <button class="btn btn-light" onclick="openMyOrders()">طلباتي</button>
   <button class="btn btn-primary" id="authButton" onclick="openAuth()">تسجيل الدخول</button>
  </div>
 </div>
</header>

<main class="container">

<section id="homePage">

 <div class="hero">
  <h1>اطلب أكلك من مطاعم عين التمر</h1>
  <p>اختر مطعمك، اطلب وجبتك وتابع طلبك خطوة بخطوة.</p>
 </div>

 <input
  id="searchInput"
  class="search"
  placeholder="ابحث عن مطعم أو وجبة..."
  oninput="renderHome()"
 >

 <div class="section-title">
  <h2>المطاعم</h2>
  <button class="btn btn-light" onclick="loadHomeData()">تحديث</button>
 </div>

 <div id="restaurantsGrid" class="grid"></div>

 <div class="section-title">
  <h2>الوجبات</h2>
 </div>

 <div id="foodsGrid" class="grid"></div>

</section>

<section id="dashboardPage" class="hidden">

 <div class="section-title">
  <h2 id="dashboardTitle">لوحة التحكم</h2>
  <button class="btn btn-light" onclick="showHome()">الرئيسية</button>
 </div>

 <div id="dashboardContent"></div>

</section>

</main>

<button class="cart" onclick="openCart()">
 🛒
 <span id="cartCount" class="cart-count">0</span>
</button>

<footer>
 تطبيق عين التمر © 2026
</footer>


<!-- AUTH MODAL -->
<div id="authModal" class="modal">
 <div class="modal-box">
  <div class="modal-head">
   <h2 id="authTitle">تسجيل الدخول</h2>
   <button class="close" onclick="closeModal('authModal')">×</button>
  </div>

  <div class="tabs">
   <button id="loginTab" class="tab active" onclick="switchAuth('login')">دخول</button>
   <button id="registerTab" class="tab" onclick="switchAuth('register')">إنشاء حساب</button>
  </div>

  <div id="loginForm">
   <div class="form-group">
    <label>البريد الإلكتروني</label>
    <input id="loginEmail" class="form-control" type="email">
   </div>

   <div class="form-group">
    <label>كلمة المرور</label>
    <input id="loginPassword" class="form-control" type="password">
   </div>

   <button class="btn btn-primary" style="width:100%" onclick="login()">تسجيل الدخول</button>
  </div>

  <div id="registerForm" class="hidden">

   <div class="form-group">
    <label>نوع الحساب</label>
    <select id="registerRole" class="form-control" onchange="changeRegisterFields()">
     <option value="customer">زبون</option>
     <option value="restaurant_owner">صاحب مطعم</option>
     <option value="driver">سائق</option>
    </select>
   </div>

   <div class="form-group">
    <label>الاسم الكامل</label>
    <input id="registerName" class="form-control">
   </div>

   <div class="form-group">
    <label>رقم الهاتف</label>
    <input id="registerPhone" class="form-control">
   </div>

   <div id="restaurantRegisterFields" class="hidden">
    <div class="form-group">
     <label>اسم المطعم</label>
     <input id="registerRestaurantName" class="form-control">
    </div>
   </div>

   <div class="form-group">
    <label>البريد الإلكتروني</label>
    <input id="registerEmail" class="form-control" type="email">
   </div>

   <div class="form-group">
    <label>كلمة المرور</label>
    <input id="registerPassword" class="form-control" type="password">
   </div>

   <button class="btn btn-primary" style="width:100%" onclick="register()">إنشاء الحساب</button>
  </div>

 </div>
</div>


<!-- CART MODAL -->
<div id="cartModal" class="modal">
 <div class="modal-box">
  <div class="modal-head">
   <h2>سلة الطلب</h2>
   <button class="close" onclick="closeModal('cartModal')">×</button>
  </div>

  <div id="cartItems"></div>

  <div id="cartCheckout" class="hidden">

   <hr>

   <div class="form-group">
    <label>الاسم</label>
    <input id="orderName" class="form-control">
   </div>

   <div class="form-group">
    <label>رقم الهاتف</label>
    <input id="orderPhone" class="form-control">
   </div>

   <div class="form-group">
    <label>عنوان التوصيل</label>
    <textarea id="orderAddress" class="form-control"></textarea>
   </div>

   <h3>المجموع: <span id="cartTotal">0</span> د.ع</h3>

   <button class="btn btn-primary" style="width:100%" onclick="createOrder()">
    تأكيد الطلب
   </button>
  </div>

 </div>
</div>


<!-- FOOD MODAL -->
<div id="foodModal" class="modal">
 <div class="modal-box">

  <div class="modal-head">
   <h2 id="foodModalTitle">إضافة وجبة</h2>
   <button class="close" onclick="closeModal('foodModal')">×</button>
  </div>

  <input type="hidden" id="foodId">

  <div class="form-group">
   <label>اسم الوجبة</label>
   <input id="foodName" class="form-control">
  </div>

  <div class="form-group">
   <label>السعر</label>
   <input id="foodPrice" class="form-control" type="number">
  </div>

  <div class="form-group">
   <label>التصنيف</label>
   <input id="foodCategory" class="form-control">
  </div>

  <div class="form-group">
   <label>الوصف</label>
   <textarea id="foodDescription" class="form-control"></textarea>
  </div>

  <div class="form-group">
   <label>رابط الصورة</label>
   <input id="foodImage" class="form-control">
  </div>

  <button class="btn btn-primary" style="width:100%" onclick="saveFood()">
   حفظ الوجبة
  </button>

 </div>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
'https://jyhmxyhzmxwprirhkjnh.supabase.co';

const SUPABASE_KEY =
'sb_publishable_BP1eIZYbAQR7Dh78-9GJrQ_oy8uuuhc';

const db = createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================
   STATE
========================= */

let currentUser = null;
let currentRole = 'customer';

let restaurants = [];
let foods = [];

let cart = [];
let cartRestaurantId = null;

let restaurantData = null;
let driverData = null;

let map = null;
let driverMarker = null;


/* =========================
   HELPERS
========================= */

window.toast = function(message){

 const el = document.getElementById('toast');

 el.textContent = message;
 el.classList.add('show');

 setTimeout(()=>{
  el.classList.remove('show');
 },3000);

};


window.closeModal = function(id){
 document.getElementById(id).classList.remove('active');
};


function openModal(id){
 document.getElementById(id).classList.add('active');
}


window.showHome = function(){

 document.getElementById('homePage').classList.remove('hidden');
 document.getElementById('dashboardPage').classList.add('hidden');

 loadHomeData();

};


function showDashboard(){

 document.getElementById('homePage').classList.add('hidden');
 document.getElementById('dashboardPage').classList.remove('hidden');

}


/* =========================
   AUTH
========================= */

window.openAuth = function(){

 if(currentUser){

  if(currentRole === 'restaurant_owner'){
   openRestaurantDashboard();
   return;
  }

  if(currentRole === 'driver'){
   openDriverDashboard();
   return;
  }

  if(currentRole === 'admin'){
   openAdminDashboard();
   return;
  }

  openMyOrders();
  return;
 }

 openModal('authModal');

};


window.switchAuth = function(type){

 const login = document.getElementById('loginForm');
 const register = document.getElementById('registerForm');

 const loginTab = document.getElementById('loginTab');
 const registerTab = document.getElementById('registerTab');

 if(type === 'login'){

  login.classList.remove('hidden');
  register.classList.add('hidden');

  loginTab.classList.add('active');
  registerTab.classList.remove('active');

 }else{

  login.classList.add('hidden');
  register.classList.remove('hidden');

  loginTab.classList.remove('active');
  registerTab.classList.add('active');

 }

};


window.changeRegisterFields = function(){

 const role = document.getElementById('registerRole').value;

 document
 .getElementById('restaurantRegisterFields')
 .classList.toggle(
  'hidden',
  role !== 'restaurant_owner'
 );

};


window.register = async function(){

 const role =
 document.getElementById('registerRole').value;

 const name =
 document.getElementById('registerName').value.trim();

 const phone =
 document.getElementById('registerPhone').value.trim();

 const email =
 document.getElementById('registerEmail').value.trim();

 const password =
 document.getElementById('registerPassword').value;

 const restaurantName =
 document.getElementById('registerRestaurantName').value.trim();


 if(!name || !email || !password){

  toast('املأ جميع الحقول المطلوبة');

  return;
 }


 if(role === 'restaurant_owner' && !restaurantName){

  toast('اكتب اسم المطعم');

  return;
 }


 const {data,error} =
 await db.auth.signUp({

  email,
  password,

  options:{
   data:{
    full_name:name,
    owner_name:name,
    phone,
    role,
    restaurant_name:
     role === 'restaurant_owner'
      ? restaurantName
      : null
   }
  }

 });


 if(error){

  toast(error.message);

  return;
 }


 toast('تم إنشاء الحساب بنجاح');

 closeModal('authModal');

};


window.login = async function(){

 const email =
 document.getElementById('loginEmail').value.trim();

 const password =
 document.getElementById('loginPassword').value;


 const {data,error} =
 await db.auth.signInWithPassword({
  email,
  password
 });


 if(error){

  toast(error.message);

  return;
 }


 currentUser = data.user;

 await loadCurrentRole();

 closeModal('authModal');

 updateAuthButton();

 routeByRole();

};


async function logout(){

 await db.auth.signOut();

 currentUser = null;
 currentRole = 'customer';

 cart = [];

 updateCartCount();

 updateAuthButton();

 showHome();

 toast('تم تسجيل الخروج');

}


window.logout = logout;


async function loadCurrentRole(){

 if(!currentUser){

  currentRole = 'customer';

  return;
 }


 const {data,error} =
 await db.rpc('get_my_role');


 if(!error && data){

  currentRole = data;

  return;

 }


 const role =
 currentUser.user_metadata?.role;

 currentRole =
 role || 'customer';

}


function updateAuthButton(){

 const btn =
 document.getElementById('authButton');

 if(currentUser){

  btn.textContent =
   currentUser.user_metadata?.full_name
   || 'حسابي';

 }else{

  btn.textContent =
   'تسجيل الدخول';

 }

}


function routeByRole(){

 if(currentRole === 'restaurant_owner'){

  openRestaurantDashboard();

 }else if(currentRole === 'driver'){

  openDriverDashboard();

 }else if(currentRole === 'admin'){

  openAdminDashboard();

 }else{

  showHome();

 }

}


/* =========================
   HOME
========================= */

async function loadHomeData(){

 const [restaurantsResult,foodsResult] =
 await Promise.all([

  db
  .from('restaurants')
  .select('*')
  .order('id'),

  db
  .from('foods')
  .select('*')
  .eq('is_available',true)
  .order('id')

 ]);


 if(restaurantsResult.error){

  toast(restaurantsResult.error.message);

  return;

 }


 if(foodsResult.error){

  toast(foodsResult.error.message);

  return;

 }


 restaurants =
 restaurantsResult.data || [];

 foods =
 foodsResult.data || [];

 renderHome();

}


window.loadHomeData = loadHomeData;


window.renderHome = function(){

 const query =
 document.getElementById('searchInput')
 .value
 .trim()
 .toLowerCase();


 const restaurantGrid =
 document.getElementById('restaurantsGrid');

 const foodGrid =
 document.getElementById('foodsGrid');


 const filteredRestaurants =
 restaurants.filter(r =>
  !query ||
  (r.name || '')
  .toLowerCase()
  .includes(query)
 );


 const filteredFoods =
 foods.filter(f =>
  !query ||
  (f.name || '')
  .toLowerCase()
  .includes(query) ||
  (f.category || '')
  .toLowerCase()
  .includes(query)
 );


 if(!filteredRestaurants.length){

  restaurantGrid.innerHTML =
   '<div class="empty">لا توجد مطاعم.</div>';

 }else{

  restaurantGrid.innerHTML =
   filteredRestaurants.map(r => `

   <div class="card">

    <img
     class="restaurant-img"
     src="${escapeHtml(r.image_url || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=80')}"
    >

    <div class="card-body">

     <h3>${escapeHtml(r.name || '')}</h3>

     <p>${escapeHtml(r.address || 'عين التمر')}</p>

     <span class="badge ${r.is_open ? 'badge-open':'badge-closed'}">
      ${r.is_open ? 'مفتوح':'مغلق'}
     </span>

     <br><br>

     <button
      class="btn btn-primary"
      onclick="filterRestaurant(${r.id})">
      عرض الوجبات
     </button>

    </div>

   </div>

  `).join('');

 }


 if(!filteredFoods.length){

  foodGrid.innerHTML =
   '<div class="empty">لا توجد وجبات.</div>';

 }else{

  foodGrid.innerHTML =
   filteredFoods.map(f => `

   <div class="card">

    <img
     class="food-img"
     src="${escapeHtml(f.image_url || 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=80')}"
    >

    <div class="card-body">

     <h3>${escapeHtml(f.name || '')}</h3>

     <p>${escapeHtml(f.description || '')}</p>

     <p>
      <span class="price">
       ${Number(f.price || 0).toLocaleString()}
      </span>
      د.ع
     </p>

     <p>
      ${escapeHtml(f.category || '')}
     </p>

     <button
      class="btn btn-primary"
      onclick="addToCartById(${f.id})">
      إضافة للسلة
     </button>

    </div>

   </div>

  `).join('');

 }

};


window.filterRestaurant = function(id){

 document.getElementById('searchInput').value = '';

 const restaurantFoods =
 foods.filter(f =>
  Number(f.restaurant_id) === Number(id)
 );

 const foodGrid =
 document.getElementById('foodsGrid');

 foodGrid.innerHTML =
 restaurantFoods.length
 ? restaurantFoods.map(f => foodCard(f)).join('')
 : '<div class="empty">لا توجد وجبات لهذا المطعم.</div>';

 foodGrid.scrollIntoView({
  behavior:'smooth'
 });

};


function foodCard(f){

 return `

 <div class="card">

  <img
   class="food-img"
   src="${escapeHtml(f.image_url || 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=80')}"
  >

  <div class="card-body">

   <h3>${escapeHtml(f.name || '')}</h3>

   <p>${escapeHtml(f.description || '')}</p>

   <p class="price">
    ${Number(f.price || 0).toLocaleString()} د.ع
   </p>

   <button
    class="btn btn-primary"
    onclick="addToCartById(${f.id})">
    إضافة للسلة
   </button>

  </div>

 </div>

 `;

}


function escapeHtml(value){

 return String(value ?? '')
 .replaceAll('&','&amp;')
 .replaceAll('<','&lt;')
 .replaceAll('>','&gt;')
 .replaceAll('"','&quot;')
 .replaceAll("'","&#039;");

}

window.addToCartById = function(foodId){

 const food =
 foods.find(f => Number(f.id) === Number(foodId));

 if(!food)return;


 if(cartRestaurantId &&
    Number(cartRestaurantId) !== Number(food.restaurant_id)){

  if(!confirm(
   'السلة تحتوي طلباً من مطعم آخر. هل تريد مسح السلة؟'
  )) return;

  cart = [];

 }


 cartRestaurantId =
 food.restaurant_id;


 const existing =
 cart.find(i =>
  Number(i.food.id) === Number(food.id)
 );


 if(existing){

  existing.quantity++;

 }else{

  cart.push({
   food,
   quantity:1
  });

 }


 updateCartCount();

 toast('تمت إضافة الوجبة للسلة');

};


function updateCartCount(){

 const count =
 cart.reduce(
  (sum,item)=>sum + item.quantity,
  0
 );

 document.getElementById('cartCount').textContent =
  count;

}


window.openCart = function(){

 renderCart();

 openModal('cartModal');

};


function renderCart(){

 const box =
 document.getElementById('cartItems');

 const checkout =
 document.getElementById('cartCheckout');


 if(!cart.length){

  box.innerHTML =
   '<div class="empty">السلة فارغة.</div>';

  checkout.classList.add('hidden');

  return;

 }


 checkout.classList.remove('hidden');


 box.innerHTML =
 cart.map((item,index)=>`

 <div class="cart-item">

  <div>
   <strong>${escapeHtml(item.food.name)}</strong>
   <br>
   ${Number(item.food.price).toLocaleString()} د.ع
  </div>

  <div class="qty">

   <button onclick="changeCartQty(${index},-1)">−</button>

   <strong>${item.quantity}</strong>

   <button onclick="changeCartQty(${index},1)">+</button>

   <button
    class="btn btn-danger"
    onclick="removeCartItem(${index})">
    حذف
   </button>

  </div>

 </div>

 `).join('');


 const total =
 cart.reduce(
  (sum,item)=>
   sum +
   Number(item.food.price || 0) *
   item.quantity,
  0
 );


 document.getElementById('cartTotal').textContent =
  total.toLocaleString();


 if(currentUser){

  document.getElementById('orderName').value =
   currentUser.user_metadata?.full_name || '';

  document.getElementById('orderPhone').value =
   currentUser.user_metadata?.phone || '';

 }

}


window.changeCartQty = function(index,change){

 cart[index].quantity += change;

 if(cart[index].quantity <= 0){

  cart.splice(index,1);

 }


 if(!cart.length){

  cartRestaurantId = null;

 }


 updateCartCount();

 renderCart();

};


window.removeCartItem = function(index){

 cart.splice(index,1);

 if(!cart.length){

  cartRestaurantId = null;

 }

 updateCartCount();

 renderCart();

};

function initDriverMap(){

 const lat =
  Number(driverData.current_lat)
  || 32.616;

 const lng =
  Number(driverData.current_lng)
  || 43.672;


 if(map){

  map.remove();

 }


 map =
 L.map('map').setView(
  [lat,lng],
  13
 );


 L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
   attribution:'© OpenStreetMap'
  }
 ).addTo(map);


 driverMarker =
 L.marker([lat,lng])
 .addTo(map)
 .bindPopup('موقعي الحالي');


}


window.updateDriverLocation =
 function(){

  if(!navigator.geolocation){

   toast('المتصفح لا يدعم تحديد الموقع');

   return;

  }


  navigator.geolocation.getCurrentPosition(
   async position=>{

    const lat =
     position.coords.latitude;

    const lng =
     position.coords.longitude;


    const {error} =
     await db.rpc(
      'driver_update_location',
      {
       p_lat:lat,
       p_lng:lng
      }
     );


    if(error){

     toast(error.message);

     return;

    }


    driverData.current_lat = lat;
    driverData.current_lng = lng;


    if(map){

     map.setView([lat,lng],15);

     if(driverMarker){

      driverMarker.setLatLng([lat,lng]);

     }else{

      driverMarker =
       L.marker([lat,lng])
       .addTo(map);

     }

    }


    toast('تم تحديث الموقع');

   },
   ()=>{
    toast('تعذر الحصول على الموقع');

   },
   {
    enableHighAccuracy:true,
    timeout:10000
   }
  );

 };

 if(!data.length){

  box.innerHTML =
   '<div class="empty">لا توجد طلبات مسندة.</div>';

  return;

 }


 box.innerHTML =
 data.map(a=>`

 <div class="order-card">

  <div class="order-head">

   <strong>
    طلب #${a.order_id}
   </strong>

   <span class="status status-${a.status}">
    ${statusArabic(a.status)}
   </span>

  </div>

  <p>
   المطعم:
   ${escapeHtml(a.orders?.restaurants?.name || '')}
  </p>

  <p>
   الزبون:
   ${escapeHtml(a.orders?.customer_name || '')}
  </p>

  <p>
   الهاتف:
   ${escapeHtml(a.orders?.customer_phone || '')}
  </p>

  <p>
   العنوان:
   ${escapeHtml(a.orders?.customer_address || '')}
  </p>

  ${driverAssignmentButtons(a)}

 </div>

 `).join('');

}


function driverAssignmentButtons(a){

 if(a.status === 'assigned'){

  return `
   <button
    class="btn btn-primary"
    onclick="updateAssignment(${a.order_id},'accepted')">
    قبول الطلب
   </button>

   <button
    class="btn btn-danger"
    onclick="updateAssignment(${a.order_id},'cancelled')">
    إلغاء
   </button>
  `;

 }


 if(a.status === 'accepted'){

  return `
   <button
    class="btn btn-warning"
    onclick="updateAssignment(${a.order_id},'picked_up')">
    استلام الطلب
   </button>
  `;

 }


 if(a.status === 'picked_up'){

  return `
   <button
    class="btn btn-success"
    onclick="updateAssignment(${a.order_id},'delivered')">
    تم التوصيل
   </button>
  `;

 }


 return '';

}


window.updateAssignment =
 async function(orderId,status){

  const {error} =
   await db.rpc(
    'driver_update_assignment_status',
    {
     p_order_id:Number(orderId),
     p_status:status
    }
   );


  if(error){

   toast(error.message);

   return;

  }


  toast('تم تحديث حالة التوصيل');

  await loadDriverAssignments();

 };


/* =========================
   ADMIN
========================= */

window.openAdminDashboard =
 async function(){

  if(!currentUser){

   openAuth();

   return;

  }


  showDashboard();

  document.getElementById('dashboardTitle').textContent =
   'لوحة الإدارة';

  await renderAdminDashboard();

  '<div class="panel">جاري تحميل لوحة الإدارة...</div>';

  driversResult,
  ordersResult
 ] = await Promise.all([

  db.from('restaurants').select('*').order('id'),

  db.from('drivers').select('*').order('created_at',{ascending:false}),

  db.from('orders').select(`
   *,

 const restaurants =

 const drivers =
  driversResult.data || [];

 const orders =
  ordersResult.data || [];


 box.innerHTML = `

 <div class="stat-grid">

 </div>


 <div class="panel">

  <h3>المطاعم</h3>

  <div class="table-wrap">

   <table>

    <thead>

     <tr>
      <th>ID</th>

     ${restaurants.map(r=>`

      <tr>

       <td>${r.id}</td>

       <td>${escapeHtml(r.name)}</td>

       <td>${escapeHtml(r.phone || '')}</td>

       <td>
        ${r.is_open?'مفتوح':'مغلق'}
       </td>

      </tr>

     `).join('')}

    </tbody>

   </table>

  </div>

 </div>


 <div class="panel">

  <h3>السائقون</h3>

  <div class="table-wrap">

   <table>

    <thead>

     <tr>
      <th>الاسم</th>
      <th>الهاتف</th>
      <th>متاح</th>
      <th>الموقع</th>
     </tr>

    </thead>

    <tbody>

     ${drivers.map(d=>`

      <tr>

 </div>


 <div class="panel">

  </button>

/* =========================
   REALTIME
========================= */

function subscribeRealtime(){

 db.channel('orders-live')
 .on(
  'postgres_changes',
  {
   event:'*',
   schema:'public',
   table:'orders'
  },
  payload=>{

   if(currentRole === 'restaurant_owner'){

    if(
     restaurantData &&
     Number(payload.new?.restaurant_id)
      === Number(restaurantData.id)
    ){

     loadRestaurantOrders();

    }

   }


   if(currentRole === 'customer'){

    if(
     payload.new?.customer_id ===
     currentUser?.id
    ){

     toast(
      `تم تحديث حالة الطلب #${payload.new.id}`
     );

    }

   }

  }
 )
 .subscribe();


 db.channel('assignments-live')
 .on(
  'postgres_changes',
  {
   event:'*',
   schema:'public',
   table:'order_assignments'
  },
  payload=>{

   if(
    currentRole === 'driver' &&
    payload.new?.driver_id === currentUser?.id
   ){

    loadDriverAssignments();

    toast('تم تحديث طلباتك');

   }

  }
 )
 .subscribe();

}


/* =========================
   STATUS
========================= */

function statusArabic(status){

 const map = {

  new:'جديد',

  accepted:'تم القبول',

  preparing:'قيد التحضير',

  ready:'جاهز',

  completed:'مكتمل',

  rejected:'مرفوض',

  assigned:'تم التعيين',

  picked_up:'تم الاستلام',

  delivered:'تم التوصيل',

  cancelled:'ملغى'

 };

 return map[status] || status;

}


/* =========================
   SESSION
========================= */

async function initialize(){

 const {data} =
  await db.auth.getSession();


 currentUser =
  data.session?.user || null;


 if(currentUser){

  await loadCurrentRole();

 }


 updateAuthButton();

 loadHomeData();

 subscribeRealtime();


 db.auth.onAuthStateChange(
  async(event,session)=>{

   currentUser =
    session?.user || null;


   if(currentUser){

    await loadCurrentRole();

   }else{

    currentRole='customer';

   }


   updateAuthButton();

  }
 );

}


initialize();

</script>
