<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلبات العراق</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Tahoma,sans-serif;
}

body{
background:#f6f6f6;
color:#222;
}

header{
background:#e30613;
color:white;
padding:15px;
position:sticky;
top:0;
z-index:100;
}

.nav{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:26px;
font-weight:bold;
}

.location{
background:#ffffff22;
border:1px solid #ffffff55;
color:white;
padding:10px 15px;
border-radius:12px;
}

.cart{
background:white;
border:0;
color:#e30613;
padding:10px 15px;
border-radius:12px;
font-weight:bold;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(135deg,#e30613,#ff5360);
color:white;
padding:30px 20px;
border-radius:22px;
margin-bottom:25px;
}

.hero h1{
font-size:30px;
margin-bottom:10px;
}

.hero p{
opacity:.9;
}

.search{
width:100%;
margin-top:20px;
padding:16px;
border:0;
border-radius:13px;
font-size:16px;
outline:none;
}

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:10px;
margin-bottom:25px;
}

.category{
border:0;
background:white;
padding:13px 18px;
border-radius:13px;
white-space:nowrap;
}

.category.active{
background:#e30613;
color:white;
}

.title{
display:flex;
justify-content:space-between;
align-items:center;
margin:20px 0 15px;
}

.title h2{
font-size:22px;
}

.restaurants{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px;
}

.restaurant{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 3px 12px #0001;
cursor:pointer;
}

.restaurant-image{
height:170px;
display:flex;
align-items:center;
justify-content:center;
font-size:75px;
background:#ffe9e9;
}

.restaurant-info{
padding:16px;
}

.restaurant-info h3{
margin-bottom:8px;
}

.rating{
color:#f5a400;
margin:8px 0;
}

.time{
color:#777;
font-size:14px;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:15px;
}

.food{
background:white;
padding:17px;
border-radius:17px;
box-shadow:0 3px 10px #0001;
}

.food h3{
margin-bottom:8px;
}

.food p{
color:#777;
font-size:14px;
line-height:1.6;
}

.food-bottom{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:14px;
}

.price{
font-weight:bold;
color:#e30613;
}

.add{
background:#e30613;
color:white;
border:0;
padding:9px 14px;
border-radius:9px;
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:200;
align-items:center;
justify-content:center;
padding:20px;
}

.modal.show{
display:flex;
}

.modal-box{
background:white;
width:100%;
max-width:520px;
max-height:90vh;
overflow:auto;
border-radius:22px;
padding:22px;
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.close{
border:0;
background:#eee;
width:36px;
height:36px;
border-radius:50%;
font-size:20px;
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 0;
border-bottom:1px solid #eee;
}

.qty{
display:flex;
gap:8px;
align-items:center;
}

.qty button{
width:30px;
height:30px;
border:0;
border-radius:7px;
background:#eee;
}

.total{
display:flex;
justify-content:space-between;
font-size:20px;
font-weight:bold;
margin:20px 0;
}

.primary{
width:100%;
padding:15px;
border:0;
border-radius:12px;
background:#e30613;
color:white;
font-size:17px;
}

.field{
margin-bottom:14px;
}

.field label{
display:block;
margin-bottom:6px;
}

.field input{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:10px;
}

.empty{
text-align:center;
padding:35px;
color:#777;
}

footer{
background:#222;
color:white;
text-align:center;
padding:30px;
margin-top:40px;
}

@media(max-width:600px){

.logo{
font-size:22px;
}

.location{
display:none;
}

.hero h1{
font-size:25px;
}

.container{
padding:14px;
}

}

</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
طلبات العراق 🇮🇶
</div>

<button class="location" onclick="changeLocation()">
📍 كربلاء
</button>

<button class="cart" onclick="openCart()">
🛒 السلة
<span id="cartCount">0</span>
</button>

</div>

</header>

<main class="container">

<section class="hero">

<h1>
شنو نفسك تاكل اليوم؟ 🍔
</h1>

<p>
اطلب من أفضل المطاعم القريبة منك
</p>

<input
id="search"
class="search"
placeholder="ابحث عن مطعم أو وجبة..."
oninput="search()"
>

</section>

<div class="categories">

<button class="category active"
onclick="filterCategory('الكل',this)">
الكل 🍽️
</button>

<button class="category"
onclick="filterCategory('برغر',this)">
برغر 🍔
</button>

<button class="category"
onclick="filterCategory('بيتزا',this)">
بيتزا 🍕
</button>

<button class="category"
onclick="filterCategory('دجاج',this)">
دجاج 🍗
</button>

<button class="category"
onclick="filterCategory('مشاوي',this)">
مشاوي 🍖
</button>

<button class="category"
onclick="filterCategory('حلويات',this)">
حلويات 🍰
</button>

</div>

<div class="title">

<h2>
المطاعم القريبة 📍
</h2>

<span>
عرض الكل
</span>

</div>

<div class="restaurants" id="restaurants">

</div>

<div class="title">

<h2>
الأكثر طلباً 🔥
</h2>

</div>

<div class="menu" id="menu">

</div>

</main>

<footer>

<p>
طلبات العراق 🇮🇶
</p>

<p style="margin-top:10px;color:#aaa">
اطلب أكلك بسهولة وسرعة
</p>

</footer>


<div class="modal" id="cartModal">

<div class="modal-box">

<div class="modal-head">

<h2>
سلة الطلب 🛒
</h2>

<button class="close" onclick="closeCart()">
×
</button>

</div>

<div id="cartItems"></div>

<div class="total">

<span>
الإجمالي
</span>

<span id="total">
0 د.ع
</span>

</div>

<button class="primary" onclick="checkout()">
تأكيد الطلب
</button>

</div>

</div>


<div class="modal" id="checkoutModal">

<div class="modal-box">

<div class="modal-head">

<h2>
تأكيد الطلب
</h2>

<button class="close" onclick="closeCheckout()">
×
</button>

</div>

<div class="field">

<label>
الاسم
</label>

<input id="name" placeholder="اكتب اسمك">

</div>

<div class="field">

<label>
رقم الهاتف
</label>

<input id="phone" placeholder="07xxxxxxxxx">

</div>

<div class="field">

<label>
العنوان
</label>

<input id="address" placeholder="المنطقة والشارع">

</div>

<button class="primary" onclick="sendOrder()">
إرسال الطلب 🚀
</button>

</div>

</div>


<script>

const restaurants=[

{
name:"برغر هاوس",
category:"برغر",
rating:"4.8",
time:"25 - 35 دقيقة",
icon:"🍔"
},

{
name:"بيتزا نابولي",
category:"بيتزا",
rating:"4.7",
time:"30 - 40 دقيقة",
icon:"🍕"
},

{
name:"دجاج العائلة",
category:"دجاج",
rating:"4.6",
time:"20 - 30 دقيقة",
icon:"🍗"
},

{
name:"المطبخ العراقي",
category:"مشاوي",
rating:"4.9",
time:"35 - 45 دقيقة",
icon:"🍖"
}

];

const foods=[

{
name:"كلاسيك برغر",
description:"لحم مشوي مع جبنة وخضار وصوص خاص",
price:6500,
category:"برغر"
},

{
name:"دبل تشيز برغر",
description:"قطعتان لحم مع الجبنة والصوص",
price:8500,
category:"برغر"
},

{
name:"بيتزا دجاج",
description:"دجاج وفلفل وزيتون وجبنة",
price:9500,
category:"بيتزا"
},

{
name:"بيتزا مارجريتا",
description:"صلصة طماطم وموزاريلا وريحان",
price:8000,
category:"بيتزا"
},

{
name:"وجبة دجاج",
description:"دجاج وبطاطا وخبز ومشروب",
price:7500,
category:"دجاج"
},

{
name:"كباب عراقي",
description:"كباب لحم مع خبز وسلطة",
price:9000,
category:"مشاوي"
},

{
name:"كيكة شوكولاتة",
description:"كيكة شوكولاتة مع كريمة",
price:6000,
category:"حلويات"
}

];

let cart=[];

let currentCategory="الكل";


function money(value){

return value.toLocaleString("ar-IQ")+" د.ع";

}


function renderRestaurants(){

const container=
document.getElementById("restaurants");

container.innerHTML="";

restaurants.forEach(r=>{

container.innerHTML+=`

<div class="restaurant">

<div class="restaurant-image">
${r.icon}
</div>

<div class="restaurant-info">

<h3>${r.name}</h3>

<p>${r.category}</p>

<div class="rating">
★★★★★ ${r.rating}
</div>

<div class="time">
🛵 ${r.time}
</div>

</div>

</div>

`;

});

}


function renderFoods(){

const container=
document.getElementById("menu");

let filtered=foods;

if(currentCategory!=="الكل"){

filtered=foods.filter(
f=>f.category===currentCategory
);

}

container.innerHTML="";

filtered.forEach((food,index)=>{

container.innerHTML+=`

<div class="food">

<h3>${food.name}</h3>

<p>
${food.description}
</p>

<div class="food-bottom">

<span class="price">
${money(food.price)}
</span>

<button class="add"
onclick="addToCart(${index})">
+ أضف
</button>

</div>

</div>

`;

});

}


function filterCategory(category,button){

currentCategory=category;

document
.querySelectorAll(".category")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

renderFoods();

}


function search(){

const value=
document
.getElementById("search")
.value
.toLowerCase();

document
.querySelectorAll(".restaurant")
.forEach(card=>{

card.style.display=
card.innerText
.toLowerCase()
.includes(value)
?"block"
:"none";

});

const menuItems=
document
.querySelectorAll(".food");

menuItems.forEach(card=>{

card.style.display=
card.innerText
.toLowerCase()
.includes(value)
?"block"
:"none";

});

}


function addToCart(index){

const food=foods[index];

cart.push(food);

updateCart();

alert("تمت إضافة "+food.name+" إلى السلة 🛒");

}


function updateCart(){

document.getElementById("cartCount")
.innerText=cart.length;

}


function openCart(){

const box=
document.getElementById("cartItems");

if(cart.length===0){

box.innerHTML=
'<div class="empty">السلة فارغة 🛒</div>';

document.getElementById("total")
.innerText="0 د.ع";

}else{

let total=0;

box.innerHTML="";

cart.forEach((item,index)=>{

total+=item.price;

box.innerHTML+=`

<div class="cart-item">

<div>
<strong>${item.name}</strong>

<div style="color:#e30613;margin-top:5px">
${money(item.price)}
</div>

</div>

<div class="qty">

<button onclick="removeItem(${index})">
−
</button>

<span>
1
</span>

</div>

</div>

`;

});

document.getElementById("total")
.innerText=money(total);

}

document
.getElementById("cartModal")
.classList.add("show");

}


function removeItem(index){

cart.splice(index,1);

updateCart();

openCart();

}


function closeCart(){

document
.getElementById("cartModal")
.classList.remove("show");

}


function checkout(){

if(cart.length===0){

alert("السلة فارغة");

return;

}

closeCart();

document
.getElementById("checkoutModal")
.classList.add("show");

}


function closeCheckout(){

document
.getElementById("checkoutModal")
.classList.remove("show");

}


function sendOrder(){

const name=
document.getElementById("name").value.trim();

const phone=
document.getElementById("phone").value.trim();

const address=
document.getElementById("address").value.trim();

if(!name||!phone||!address){

alert("يرجى إدخال جميع المعلومات");

return;

}

const orderNumber=
"IQ"+Math.floor(
100000+Math.random()*900000
);

alert(
"تم إرسال طلبك بنجاح! 🎉\n"+
"رقم الطلب: "+orderNumber
);

cart=[];

updateCart();

closeCheckout();

}


function changeLocation(){

const location=
prompt(
"اكتب منطقتك:",
"كربلاء"
);

if(location){

document
.querySelector(".location")
.innerText=
"📍 "+location;

}

}


renderRestaurants();

renderFoods();

</script>

</body>
</html>
